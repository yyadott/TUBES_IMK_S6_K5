<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tambah Kategori</title>

<style>
:root{
    --primary:#1A4FBF;
    --bg:#F0F4FF;
    --surface:#FFFFFF;
    --card:#FFFFFF;
    --text:#0F1F4B;
    --text-soft:#5A6A8A;
    --border:#C8D5F5;
    --accent:#1A4FBF;
    --accent-soft:#DCE8FF;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-tap-highlight-color:transparent;
}

body{
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    min-height:100dvh;
}

.container{
    max-width:480px;
    margin:auto;
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
}

/* HEADER */
header.page-head{
    padding:20px 20px 4px;
    display:flex;
    align-items:center;
    gap:12px;
    max-width:560px;
    margin:0 auto;
}

header.page-head .back-btn{
    width:34px;
    height:34px;
    border-radius:10px;
    border:1px solid var(--border);
    background:var(--surface);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
    cursor:pointer;
}

header.page-head .back-btn svg{
    width:18px;
    height:18px;
    color:var(--text);
}

header.page-head .head-text h1{
    font-size:1.4rem;
    font-weight:700;
    letter-spacing:-0.01em;
}

header.page-head .head-text p{
    color:var(--text-soft);
    font-size:0.85rem;
    margin-top:2px;
}

/* SCROLL AREA */
.scroll-area{
    flex:1;
    padding:16px 20px;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
}

.card{
    background:var(--card);
    border-radius:16px;
    padding:18px;
    border:1px solid var(--border);
}

/* TYPE SWITCH */
.type-switch{
    display:flex;
    gap:10px;
    margin-bottom:18px;
}

.type-btn{
    flex:1;
    border:none;
    border-radius:12px;
    padding:14px 8px;
    font-weight:600;
    font-size:.95rem;
    cursor:pointer;
    background:#E5E7EB;
    color:var(--text-soft);
    transition:.2s;
    min-height:48px;
    font-family:inherit;
}

.type-btn.active{
    background:var(--accent);
    color:#fff;
}

/* FORM */
.form-group{margin-bottom:18px;}

label{
    display:block;
    font-size:.85rem;
    margin-bottom:8px;
    font-weight:600;
    color:var(--text);
}

input{
    width:100%;
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px;
    font-size:16px;
    outline:none;
    color:var(--text);
    background:var(--bg);
    -webkit-appearance:none;
    font-family:inherit;
}

input:focus{border-color:var(--accent);}

/* ICON GRID */
.icon-grid{
    display:grid;
    grid-template-columns:repeat(6,1fr);
    gap:10px;
    padding-top:4px;
}

@media(max-width:360px){
    .icon-grid{grid-template-columns:repeat(5,1fr);}
}

.icon-item{
    aspect-ratio:1;
    border-radius:50%;
    background:#E8EDFF;
    border:2px solid transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:background .15s ease,border-color .15s ease;
    min-height:44px;
}

.icon-item svg{
    width:20px;
    height:20px;
    color:var(--text-soft);
    transition:color .15s ease;
}

.icon-item.active{
    background:var(--accent);
    border-color:var(--accent);
}

.icon-item.active svg{color:#fff;}
.icon-item:active{opacity:.7;}

/* PREVIEW */
.preview-box{
    display:flex;
    align-items:center;
    gap:12px;
    background:var(--bg);
    border:1px solid var(--border);
    border-radius:14px;
    padding:13px;
    margin-bottom:18px;
}

.icon-circle-preview{
    width:46px;
    height:46px;
    border-radius:50%;
    background:var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
}

.icon-circle-preview svg{width:20px;height:20px;color:#fff;}

.preview-text{font-weight:700;color:var(--text);}

.preview-label{
    font-size:.72rem;
    color:var(--text-soft);
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:.04em;
    margin-bottom:2px;
}

/* BUTTONS */
.button-group{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.btn{
    flex:1;
    border:none;
    border-radius:12px;
    padding:15px 8px;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    min-height:52px;
    font-family:inherit;
}

.btn:active{opacity:.85;}

.btn-cancel{
    background:var(--accent-soft);
    color:var(--accent);
}

.btn-save{
    background:var(--accent);
    color:#fff;
}

.success-msg{
    margin-top:14px;
    text-align:center;
    color:var(--accent);
    font-weight:600;
    font-size:.9rem;
}

/* COLOR PALETTE */
.color-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
    gap: 8px;
    padding-top: 4px;
}

@media(max-width:360px){
    .color-grid{grid-template-columns:repeat(7,1fr);}
}

.color-item{
    aspect-ratio:1;
    border-radius:50%;
    border:2.5px solid transparent;
    cursor:pointer;
    min-height:36px;
    transition:transform .15s ease,border-color .15s ease;
    position:relative;
}

.color-item:active{transform:scale(.88);}

.color-item .check{
    display:none;
    position:absolute;
    inset:0;
    align-items:center;
    justify-content:center;
    font-size:13px;
    font-weight:700;
}

.color-item.active .check{display:flex;}

@supports(padding-bottom:env(safe-area-inset-bottom)){
    .scroll-area{
        padding-bottom:calc(16px + env(safe-area-inset-bottom));
    }
}
</style>
</head>
<body>

<div class="container">

    <header class="page-head">
        <button class="back-btn" onclick="history.back()" aria-label="Kembali">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"/>
                <polyline points="12 19 5 12 12 5"/>
            </svg>
        </button>
        <div class="head-text">
            <h1>Tambah Kategori</h1>
            <p>Buat kategori pengeluaran atau pemasukan</p>
        </div>
    </header>

    <div class="scroll-area">
        <div class="card">

            <div class="preview-box">
                <span class="icon-circle-preview" id="previewIcon"></span>
                <div>
                    <div class="preview-label">Pratinjau</div>
                    <div class="preview-text" id="previewName">Kategori Baru</div>
                </div>
            </div>

            <div class="form-group">
                <label>Jenis Kategori</label>
                <div class="type-switch">
                    <button type="button" id="expenseBtn" class="type-btn active">Pengeluaran</button>
                    <button type="button" id="incomeBtn" class="type-btn">Pemasukan</button>
                </div>
            </div>

            <div class="form-group">
                <label>Nama Kategori</label>
                <input type="text" id="categoryName" placeholder="Misal: Asuransi">
            </div>

            <div class="form-group">
                <label>Pilih Icon</label>
                <div class="icon-grid" id="iconGrid"></div>
            </div>

            <div class="form-group">
                <label>Warna Kategori</label>
                <div class="color-grid" id="colorGrid"></div>
            </div>

            <div class="button-group">
                <button type="button" class="btn btn-cancel" onclick="history.back()">Batal</button>
                <button type="button" class="btn btn-save" id="saveBtn">Simpan</button>
            </div>

            <div class="success-msg" id="successMsg"></div>

        </div>
    </div>
</div>

<script>
const iconOptions = [
    { id:"makanan",    paths:`<path d="M3 3v7c0 1.1.9 2 2 2h2V3" /><path d="M5 3v18" /><path d="M19 3a4 4 0 0 0-4 4v5h4" /><path d="M17 12v9" />` },
    { id:"transport",  paths:`<path d="M5 17h-2v-6l2 -5h11l2 5h1a2 2 0 0 1 2 2v4h-2" /><circle cx="7" cy="17" r="2" /><circle cx="17" cy="17" r="2" /><path d="M9 17h6" />` },
    { id:"hiburan",    paths:`<rect x="3" y="5" width="18" height="14" rx="2" /><path d="M7 5l3 4M14 5l3 4" />` },
    { id:"belanja",    paths:`<path d="M5 8h14l-1 12H6L5 8z" /><path d="M9 8a3 3 0 0 1 6 0" />` },
    { id:"uang",       paths:`<rect x="2" y="6" width="20" height="12" rx="2" /><circle cx="12" cy="12" r="2" /><path d="M6 12h.01M18 12h.01" />` },
    { id:"laptop",     paths:`<rect x="3" y="4" width="18" height="12" rx="1" /><path d="M2 20h20" />` },
    { id:"hadiah",     paths:`<rect x="3" y="8" width="18" height="4" rx="1" /><path d="M12 8v13" /><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7" /><path d="M7.5 8a2.5 2.5 0 0 1 0-5C9 3 12 6 12 8" /><path d="M16.5 8a2.5 2.5 0 0 0 0-5C15 3 12 6 12 8" />` },
    { id:"rumah",      paths:`<path d="M3 9.5 12 3l9 6.5" /><path d="M5 9v10a1 1 0 0 0 1 1h3v-6h6v6h3a1 1 0 0 0 1-1V9" />` },
    { id:"kesehatan",  paths:`<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z" />` },
    { id:"pendidikan", paths:`<path d="M2 4h7a4 4 0 0 1 4 4v12a3 3 0 0 0-3-3H2z" /><path d="M22 4h-7a4 4 0 0 0-4 4v12a3 3 0 0 1 3-3h8z" />` },
    { id:"travel",     paths:`<path d="M22 2 11 13" /><path d="M22 2 15 22l-4-9-9-4 20-7z" />` },
    { id:"lainnya",    paths:`<circle cx="6" cy="12" r="1.5" /><circle cx="12" cy="12" r="1.5" /><circle cx="18" cy="12" r="1.5" />` }
];

const colorOptions = [
    { bg:"#FECACA", icon:"#991B1B" },
    { bg:"#FED7AA", icon:"#9A3412" },
    { bg:"#FEF08A", icon:"#854D0E" },
    { bg:"#BBF7D0", icon:"#166534" },
    { bg:"#99F6E4", icon:"#0F766E" },
    { bg:"#BAE6FD", icon:"#075985" },
    { bg:"#C7D2FE", icon:"#3730A3" },
    { bg:"#FBCFE8", icon:"#9D174D" },
    { bg:"#FCA5A5", icon:"#7F1D1D" },
    { bg:"#6EE7B7", icon:"#064E3B" },
    { bg:"#D9F99D", icon:"#3F6212" },
    { bg:"#E9D5FF", icon:"#6B21A8" },
    { bg:"#A5F3FC", icon:"#164E63" },
    { bg:"#FDE68A", icon:"#78350F" },
    { bg:"#C4B5FD", icon:"#4C1D95" },
    { bg:"#D1FAE5", icon:"#065F46" },
    { bg:"#CFFAFE", icon:"#155E75" },
    { bg:"#FCE7F3", icon:"#831843" },
    { bg:"#E0F2FE", icon:"#0C4A6E" },
    { bg:"#F1F5F9", icon:"#334155" }
];

let selectedColor = colorOptions[0];
let selectedIconId = iconOptions[0].id;
let currentType = "expense";

const expenseBtn      = document.getElementById("expenseBtn");
const incomeBtn       = document.getElementById("incomeBtn");
const categoryNameInput = document.getElementById("categoryName");
const iconGrid        = document.getElementById("iconGrid");
const previewIcon     = document.getElementById("previewIcon");
const previewName     = document.getElementById("previewName");

function svgMarkup(paths){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + paths + '</svg>';
}

function renderIconGrid(){
    iconGrid.innerHTML = "";
    iconOptions.forEach(icon => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "icon-item" + (icon.id === selectedIconId ? " active" : "");
        item.setAttribute("aria-label", "Pilih icon " + icon.id);
        item.innerHTML = svgMarkup(icon.paths);
        item.addEventListener("click", () => {
            selectedIconId = icon.id;
            iconGrid.querySelectorAll(".icon-item").forEach(el => el.classList.remove("active"));
            item.classList.add("active");
            updatePreview();
        });
        iconGrid.appendChild(item);
    });
}

function renderColorGrid(){
    const grid = document.getElementById("colorGrid");
    grid.innerHTML = "";
    colorOptions.forEach(color => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "color-item" + (color === selectedColor ? " active" : "");
        item.style.background = color.bg;
        item.style.borderColor = color === selectedColor ? color.icon : "transparent";
        item.innerHTML = `<span class="check" style="color:${color.icon}">✓</span>`;
        item.addEventListener("click", () => {
            selectedColor = color;
            grid.querySelectorAll(".color-item").forEach(el => {
                el.classList.remove("active");
                el.style.borderColor = "transparent";
            });
            item.classList.add("active");
            item.style.borderColor = color.icon;
            updatePreview();
        });
        grid.appendChild(item);
    });
}

function updatePreview(){
    const icon = iconOptions.find(i => i.id === selectedIconId) || iconOptions[0];
    previewIcon.innerHTML = svgMarkup(icon.paths);
    previewIcon.style.background = selectedColor.bg;
    previewIcon.querySelector("svg").style.color = selectedColor.icon;
    previewName.textContent = categoryNameInput.value.trim() || "Kategori Baru";
}

expenseBtn.addEventListener("click", () => {
    currentType = "expense";
    expenseBtn.classList.add("active");
    incomeBtn.classList.remove("active");
});

incomeBtn.addEventListener("click", () => {
    currentType = "income";
    incomeBtn.classList.add("active");
    expenseBtn.classList.remove("active");
});

categoryNameInput.addEventListener("input", updatePreview);

document.getElementById("saveBtn").addEventListener("click", () => {
    if(categoryNameInput.value.trim() === ""){
        alert("Masukkan nama kategori terlebih dahulu.");
        return;
    }
    document.getElementById("successMsg").textContent = "✓ Kategori berhasil ditambahkan";
    setTimeout(() => history.back(), 800);
});

renderIconGrid();
renderColorGrid();
updatePreview();
</script>

</body>
</html>
