<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Anggaran - Book Market</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/style.css">
    <style>
        /* Style kustom tambahan untuk tombol hapus anggaran */
        .wrapper-anggaran-kustom {
            position: relative;
        }
        .btn-hapus-anggaran {
            position: absolute;
            top: 10px;
            right: 15px;
            background: transparent;
            border: none;
            color: #ef4444;
            font-size: 1.1rem;
            cursor: pointer;
            transition: transform 0.2s, color 0.2s;
            z-index: 10;
        }
        .btn-hapus-anggaran:hover {
            transform: scale(1.2);
            color: #dc2626;
        }
    </style>
</head>
<body>

    <div class="main-app-container px-4 pt-4">
        
        <div class="d-flex justify-content-between align-items-center mb-1">
            <h1 class="fw-black" style="font-weight: 800; font-size: 2.2rem; color: #0f172a;">Anggaran</h1>
            <img src="assets/img/yudi.jpg" onerror="this.src='https://via.placeholder.com/150'" class="profile-avatar" alt="Avatar User">
        </div>
        <p class="text-muted small mb-4">Kelola pengeluaran bulanan Anda</p>

        <div class="mb-5">
            <a href="/tambah-anggaran/index.html" class="btn btn-add-budget d-flex align-items-center justify-content-center gap-2 shadow-sm text-decoration-none">
                <i class="bi bi-plus-circle-fill fs-5 text-dark"></i> Tambah Anggaran
            </a>
        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="fw-bold m-0" style="color: #0f172a; font-size: 1.2rem;">Daftar Anggaran</h5>
            <a href="/daftar-anggaran/index.html" class="text-decoration-none fw-bold" style="color: #5a67d8; font-size: 0.95rem;">Lihat Semua</a>
        </div>

        <div id="listAnggaranContainer">
            <!-- Kartu anggaran kustom akan dirender di sini melalui JavaScript -->
         </div>
         
        <div class="bottom-nav">
            <a href="index.php" class="nav-item-box">
                <i class="bi bi-grid-fill"></i>Hom
            </a>
            <a href="anggaran.html" class="nav-item-box active">
                <i class="bi bi-wallet2"></i>Bajeut
                <span class="notification-dot"></span>
            </a>
            <a href="statistik.php" class="nav-item-box">
                <i class="bi bi-bar-chart-line-fill"></i>Statistig
            </a>
            <a href="setting.php" class="nav-item-box">
                <i class="bi bi-sliders"></i>Settig
            </a>
        </div>
        
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const listAnggaranContainer = document.getElementById('listAnggaranContainer');

            // 1. FUNGSI UNTUK MERENDER ANGGARAN KUSTOM DARI LOCALSTORAGE
            function renderAnggaranKustom() {
                // Bersihkan semua elemen kustom lama agar saat dihapus tidak terjadi penumpukan render ganda
                const elemenKustomLama = listAnggaranContainer.querySelectorAll('.wrapper-anggaran-kustom');
                elemenKustomLama.forEach(el => el.remove());

                const anggaranKustomList = JSON.parse(localStorage.getItem('anggaran_kustom')) || [];
                
                anggaranKustomList.forEach((item, index) => {
                    const wrapper = document.createElement('div');
                    wrapper.className = 'wrapper-anggaran-kustom';
                    
                    const formatTarget = new Intl.NumberFormat('id-ID', { 
                        style: 'currency', 
                        currency: 'IDR', 
                        minimumFractionDigits: 0 
                    }).format(item.target);

                    wrapper.innerHTML = `
                        <button type="button" class="btn-hapus-anggaran" data-index="${index}">
                            <i class="bi bi-trash3-fill"></i>
                        </button>
                        <div class="budget-card">
                            <div class="d-flex justify-content-between align-items-start mb-3">
                                <div class="d-flex align-items-center gap-3">
                                    <div class="icon-box bg-icon-${item.warnaClass}">
                                        <i class="bi ${item.ikonClass}"></i>
                                    </div>
                                    <div style="max-width: 180px;">
                                        <h6 class="fw-bold mb-1 text-truncate" style="font-size: 1.05rem;">${item.nama}</h6>
                                        <span class="text-muted small d-block" style="font-size: 0.8rem;">Kategori: ${item.kategori}</span>
                                    </div>
                                </div>
                                <div class="text-end" style="padding-right: 25px;">
                                    <span class="fw-bold d-block text-success" style="font-size: 0.95rem;">Sisa ${formatTarget}</span>
                                </div>
                            </div>
                            <div class="progress progress-custom mb-2">
                                <div class="progress-bar" role="progressbar" style="width: 0%; background-color: #27ae60;"></div>
                            </div>
                            <div class="d-flex justify-content-between text-muted" style="font-size: 0.75rem; font-weight: 600;">
                                <span>Rp 0</span>
                                <span>Target: ${formatTarget}</span>
                            </div>
                        </div>
                    `;
                    
                    listAnggaranContainer.appendChild(wrapper);
                });

                // Pasang event listener ke semua tombol hapus setelah kartu berhasil dibuat
                daftarkanEventHapusAnggaran();
            }

            // 2. FUNGSI LOGIKA EKSEKUSI PENGHAPUSAN DATA ANGGARAN
            function daftarkanEventHapusAnggaran() {
                const tombolHapus = document.querySelectorAll('.btn-hapus-anggaran');
                tombolHapus.forEach(btn => {
                    btn.addEventListener('click', function() {
                        if (confirm("Apakah Anda yakin ingin menghapus anggaran belanja ini?")) {
                            const indexHapus = parseInt(this.getAttribute('data-index'));
                            let anggaranKustomList = JSON.parse(localStorage.getItem('anggaran_kustom')) || [];
                            
                            // Hapus target baris item dari array berdasarkan indexnya
                            anggaranKustomList.splice(indexHapus, 1);
                            
                            // Simpan kembali array yang sudah diperbarui ke memori browser
                            localStorage.setItem('anggaran_kustom', JSON.stringify(anggaranKustomList));
                            
                            // Segarkan ulang visual komponen card di layar
                            renderAnggaranKustom();
                        }
                    });
                });
            }

            // Jalankan fungsi pemuatan list anggaran saat halaman pertama kali dibuka
            renderAnggaranKustom();
        });
    </script>
</body>
</html>
