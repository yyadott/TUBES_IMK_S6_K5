<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Home - Catatan Keuangan</title>
<style>
  :root{
    --bg:#FAFAF8;
    --surface:#FFFFFF;
    --border:#E6E4E0;
    --text:#2B2B28;
    --text-soft:#8A8782;
    --accent:#4F6F52;
    --accent-soft:#E7EFE8;
    --warn:#C9A227;
    --warn-soft:#FBF6E3;
    --alert:#C9722E;
    --alert-soft:#FBEDE3;
    --danger:#B5544A;
    --danger-soft:#FBE8E5;
    --radius:14px;
    --gap:16px;
    font-size:16px;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ -webkit-tap-highlight-color:transparent; }

  body{
    font-family:'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.45;
    padding-bottom:84px;
  }

  /* ============ HEADER ============ */
  .page-head{
    padding:22px 20px 0;
    max-width:560px;
    margin:0 auto;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
  }
  .page-head h1{
    font-size:1.4rem;
    font-weight:700;
    letter-spacing:-0.01em;
  }
  .page-head .greeting{
    font-size:0.85rem;
    color:var(--text-soft);
    margin-top:2px;
  }

  /* ============ DATE FILTER ============ */
  .date-filter{
    display:flex;
    align-items:center;
    gap:6px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:10px;
    padding:7px 10px;
    cursor:pointer;
    flex-shrink:0;
    margin-top:4px;
  }
  .date-filter svg{ width:15px; height:15px; color:var(--text-soft); }
  .date-filter span{
    font-size:0.78rem;
    font-weight:700;
    color:var(--text);
    white-space:nowrap;
  }
  .date-filter:active{ background:var(--bg); }

  /* hidden date input overlay */
  .date-filter input[type="date"]{
    position:absolute;
    opacity:0;
    width:0;
    height:0;
    pointer-events:none;
  }

  /* ============ MAIN ============ */
  main{
    max-width:560px;
    margin:0 auto;
    padding:0 20px;
  }

  /* ============ SUMMARY CONTAINER ============ */
  .summary-container{
    margin-top:18px;
    background:var(--accent);
    border-radius:var(--radius);
    padding:18px;
    color:#fff;
    position:relative;
    overflow:hidden;
  }
  /* subtle decorative circle */
  .summary-container::before{
    content:'';
    position:absolute;
    right:-32px; top:-32px;
    width:120px; height:120px;
    border-radius:50%;
    background:rgba(255,255,255,.07);
    pointer-events:none;
  }
  .summary-container::after{
    content:'';
    position:absolute;
    right:30px; bottom:-40px;
    width:90px; height:90px;
    border-radius:50%;
    background:rgba(255,255,255,.05);
    pointer-events:none;
  }

  .summary-label{
    font-size:0.72rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.05em;
    opacity:.75;
    margin-bottom:4px;
  }
  .summary-today{
    font-size:1.9rem;
    font-weight:800;
    letter-spacing:-0.02em;
    line-height:1.1;
  }

  .summary-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:16px;
    padding-top:14px;
    border-top:1px solid rgba(255,255,255,.18);
  }
  .summary-item .s-label{
    font-size:0.7rem;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
    opacity:.7;
    margin-bottom:3px;
  }
  .summary-item .s-value{
    font-size:1.05rem;
    font-weight:700;
  }
  .summary-item .s-value.warn{ color:#FFE082; }
  .summary-item .s-value.danger{ color:#FFAB9A; }

  /* progress mini */
  .summary-progress{
    margin-top:12px;
    height:5px;
    border-radius:999px;
    background:rgba(255,255,255,.2);
    overflow:hidden;
  }
  .summary-progress-fill{
    height:100%;
    border-radius:999px;
    background:rgba(255,255,255,.9);
    transition:width .4s ease;
  }
  .summary-progress-fill.warn{ background:#FFE082; }
  .summary-progress-fill.danger{ background:#FFAB9A; }

  .summary-pct{
    font-size:0.72rem;
    font-weight:700;
    opacity:.75;
    margin-top:5px;
  }

  /* ============ TRANSACTIONS SECTION ============ */
  .section-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:26px;
    margin-bottom:12px;
  }
  .section-head h2{
    font-size:0.95rem;
    font-weight:700;
  }
  .section-head .count{
    font-size:0.78rem;
    color:var(--text-soft);
  }

  /* ============ TRANSACTION CARDS ============ */
  .tx-list{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .tx-card{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:14px;
    display:flex;
    align-items:center;
    gap:12px;
  }

  .tx-icon{
    width:42px; height:42px;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .tx-icon svg{ width:20px; height:20px; }

  .tx-info{ flex:1; min-width:0; }
  .tx-title{
    font-size:0.92rem;
    font-weight:700;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .tx-category{
    font-size:0.75rem;
    color:var(--text-soft);
    margin-top:2px;
    display:flex;
    align-items:center;
    gap:4px;
  }
  .tx-category .cat-dot{
    width:6px; height:6px;
    border-radius:50%;
    flex-shrink:0;
  }

  .tx-amount{
    font-size:0.95rem;
    font-weight:800;
    color:var(--text);
    flex-shrink:0;
    letter-spacing:-0.01em;
  }

  /* empty state */
  .empty-state{
    text-align:center;
    padding:40px 20px;
    color:var(--text-soft);
    display:none;
  }
  .empty-state svg{ width:40px; height:40px; margin:0 auto 10px; display:block; opacity:.4; }
  .empty-state p{ font-size:0.88rem; }

  /* ============ BOTTOM NAV ============ */
  .bottom-nav{
    position:fixed;
    left:0; right:0; bottom:0;
    height:64px;
    background:var(--surface);
    border-top:1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-around;
    padding:0 4px;
    max-width:560px;
    margin:0 auto;
  }
  .nav-item{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2px;
    color:var(--text-soft);
    text-decoration:none;
    font-size:0.62rem;
  }
  .nav-item svg{ width:20px; height:20px; }
  .nav-item.active{ color:var(--accent); font-weight:700; }
  .nav-add{
    width:42px; height:42px;
    border-radius:50%;
    background:var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
    margin-top:-18px;
  }
  .nav-add svg{ width:22px; height:22px; color:#fff; }

  @media (min-width:768px){
    .page-head, main{ max-width:920px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; }
  }
</style>
</head>
<body>

<!-- ============ HEADER ============ -->
<header class="page-head">
  <div>
    <h1>Hai, Zidan 👋</h1>
    <p class="greeting" id="greetingText">Pantau keuanganmu hari ini</p>
  </div>
  <div class="date-filter" id="dateFilterBtn" role="button" aria-label="Pilih tanggal">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    <span id="dateLabel">Hari ini</span>
    <input type="date" id="datePicker">

</header>

<main>

  <!-- ============ SUMMARY ============ -->
  <div class="summary-container" aria-label="Ringkasan keuangan">
    <div class="summary-label" id="summaryPeriodLabel">Pengeluaran hari ini</div>
    <div class="summary-today" id="summaryToday">Rp 370.000</div>

    <div class="summary-row">
      <div class="summary-item">
        <div class="s-label">Total Anggaran</div>
        <div class="s-value" id="summaryBudget">Rp 2.500.000</div>
      </div>
      <div class="summary-item">
        <div class="s-label">Sisa Anggaran</div>
        <div class="s-value warn" id="summaryRemaining">Rp 660.000</div>
      </div>
    </div>

    <div class="summary-progress">
      <div class="summary-progress-fill warn" id="summaryBar" style="width:74%"></div>
    </div>
    <div class="summary-pct" id="summaryPct">74% terpakai dari total anggaran bulan ini</div>
  </div>

  <!-- ============ TRANSACTION LIST ============ -->
  <div class="section-head">
    <h2 id="txHeading">Transaksi hari ini</h2>
    <span class="count" id="txCount">3 transaksi</span>
  </div>

  <div class="tx-list" id="txList"></div>

  <div class="empty-state" id="emptyState">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h18M3 12h18M3 17h18"/></svg>
    <p>Tidak ada transaksi di tanggal ini</p>
  </div>

</main>

<script>
/* =========================================================
   HELPERS
========================================================= */
const rupiah = n => (n < 0
  ? '-Rp ' + Math.abs(n).toLocaleString('id-ID')
  : 'Rp ' + n.toLocaleString('id-ID'));

function toYMD(date){
  return date.toISOString().slice(0,10);
}
function formatDateLabel(ymd){
  const today = toYMD(new Date());
  const yesterday = toYMD(new Date(Date.now() - 86400000));
  if(ymd === today) return 'Hari ini';
  if(ymd === yesterday) return 'Kemarin';
  const d = new Date(ymd + 'T00:00:00');
  return d.toLocaleDateString('id-ID', { day:'numeric', month:'short', year:'numeric' });
}
function formatDateHeading(ymd){
  const today = toYMD(new Date());
  const yesterday = toYMD(new Date(Date.now() - 86400000));
  if(ymd === today) return 'Transaksi hari ini';
  if(ymd === yesterday) return 'Transaksi kemarin';
  const d = new Date(ymd + 'T00:00:00');
  return 'Transaksi ' + d.toLocaleDateString('id-ID', { day:'numeric', month:'long' });
}

/* =========================================================
   ICON SVG PATHS (sama dengan statistik)
========================================================= */
const iconPaths = {
  'ti-tools-kitchen-2': '<path d="M3 3v7c0 1.1.9 2 2 2h2V3"/><path d="M5 3v18"/><path d="M19 3a4 4 0 0 0-4 4v5h4"/><path d="M17 12v9"/>',
  'ti-car':             '<path d="M5 17h-2v-6l2-5h11l2 5h1a2 2 0 0 1 2 2v4h-2"/><circle cx="7" cy="17" r="2"/><circle cx="17" cy="17" r="2"/><path d="M9 17h6"/>',
  'ti-movie':           '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 5l3 4M14 5l3 4"/>',
  'ti-shopping-bag':    '<path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8a3 3 0 0 1 6 0"/>',
  'ti-dots':            '<circle cx="6" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="18" cy="12" r="1.5"/>',
};

function iconSVG(key, color){
  const path = iconPaths[key] || iconPaths['ti-dots'];
  return `<svg viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${path}</svg>`;
}

/* =========================================================
   CATEGORIES (sesuai statistik)
========================================================= */
const categories = {
  makanan:    { label:'Makanan',     icon:'ti-tools-kitchen-2', color:'#4F6F52' },
  transport:  { label:'Transportasi',icon:'ti-car',             color:'#C97B4A' },
  hiburan:    { label:'Hiburan',     icon:'ti-movie',           color:'#7A8FAE' },
  belanja:    { label:'Belanja',     icon:'ti-shopping-bag',    color:'#B5544A' },
  lainnya:    { label:'Lainnya',     icon:'ti-dots',            color:'#C9B458' },
};

/* =========================================================
   DUMMY TRANSACTIONS PER DATE
========================================================= */
const today = toYMD(new Date());
const yesterday = toYMD(new Date(Date.now() - 86400000));
const twoDaysAgo = toYMD(new Date(Date.now() - 2*86400000));

const transactions = {
  [today]: [
    { id:1, title:'Sarapan nasi uduk',     cat:'makanan',   amount:25000  },
    { id:2, title:'Naik ojek ke kampus',   cat:'transport', amount:18000  },
    { id:3, title:'Nonton film bioskop',   cat:'hiburan',   amount:55000  },
  ],
  [yesterday]: [
    { id:4, title:'Makan siang warteg',    cat:'makanan',   amount:20000  },
    { id:5, title:'Beli buku catatan',     cat:'belanja',   amount:35000  },
    { id:6, title:'Ongkos bus pulang',     cat:'transport', amount:8000   },
    { id:7, title:'Jajan minuman',         cat:'lainnya',   amount:15000  },
  ],
  [twoDaysAgo]: [
    { id:8, title:'Belanja bulanan',       cat:'belanja',   amount:320000 },
    { id:9, title:'Langganan streaming',   cat:'hiburan',   amount:54000  },
  ],
};

/* budget & usage per date (bulan ini, sama untuk semua tanggal di dummy ini) */
const budgetData = {
  totalBudget: 2500000,
  totalUsed:   1840000,
};

/* =========================================================
   STATE
========================================================= */
let selectedDate = today;

/* =========================================================
   RENDER
========================================================= */
function render(){
  renderSummary();
  renderTransactions();
}

function renderSummary(){
  const txs = transactions[selectedDate] || [];
  const todayTotal = txs.reduce((s,t) => s + t.amount, 0);
  const { totalBudget, totalUsed } = budgetData;
  const remaining = totalBudget - totalUsed;
  const pct = Math.min(100, Math.round((totalUsed / totalBudget) * 100));

  // label atas container
  const isToday = selectedDate === today;
  document.getElementById('summaryPeriodLabel').textContent =
    isToday ? 'Pengeluaran hari ini' : 'Pengeluaran ' + formatDateLabel(selectedDate).toLowerCase();

  document.getElementById('summaryToday').textContent = rupiah(todayTotal);
  document.getElementById('summaryBudget').textContent = rupiah(totalBudget);

  const remEl = document.getElementById('summaryRemaining');
  remEl.textContent = rupiah(remaining);

  // tier warna sisa
  let tier = '';
  if(pct >= 100) tier = 'danger';
  else if(pct >= 80) tier = 'warn';
  remEl.className = 's-value' + (tier ? ' ' + tier : '');

  const bar = document.getElementById('summaryBar');
  bar.style.width = pct + '%';
  bar.className = 'summary-progress-fill' + (tier ? ' ' + tier : '');

  document.getElementById('summaryPct').textContent =
    `${pct}% terpakai dari total anggaran bulan ini`;
}

function renderTransactions(){
  const txs = transactions[selectedDate] || [];
  const list = document.getElementById('txList');
  const empty = document.getElementById('emptyState');
  const heading = document.getElementById('txHeading');
  const count = document.getElementById('txCount');

  heading.textContent = formatDateHeading(selectedDate);
  count.textContent = txs.length > 0 ? `${txs.length} transaksi` : '';

  if(txs.length === 0){
    list.innerHTML = '';
    list.style.display = 'none';
    empty.style.display = 'block';
    return;
  }

  list.style.display = 'flex';
  empty.style.display = 'none';

  list.innerHTML = txs.map(tx => {
    const cat = categories[tx.cat] || categories.lainnya;
    return `<div class="tx-card">
      <div class="tx-icon" style="background:${cat.color}18;">
        ${iconSVG(cat.icon, cat.color)}
      </div>
      <div class="tx-info">
        <div class="tx-title">${tx.title}</div>
        <div class="tx-category">
          <span class="cat-dot" style="background:${cat.color};"></span>
          ${cat.label}
        </div>
      </div>
      <div class="tx-amount">-${rupiah(tx.amount)}</div>
    </div>`;
  }).join('');
}

/* =========================================================
   DATE FILTER
========================================================= */
const dateLabel  = document.getElementById('dateLabel');
const datePicker = document.getElementById('datePicker');
const filterBtn  = document.getElementById('dateFilterBtn');

// set max = today, value = today
datePicker.max   = today;
datePicker.value = today;

filterBtn.addEventListener('click', ()=>{
  datePicker.style.pointerEvents = 'all';
  datePicker.showPicker ? datePicker.showPicker() : datePicker.click();
});

datePicker.addEventListener('change', ()=>{
  selectedDate = datePicker.value || today;
  dateLabel.textContent = formatDateLabel(selectedDate);
  datePicker.style.pointerEvents = 'none';
  render();
});

/* =========================================================
   GREETING DINAMIS
========================================================= */
function setGreeting(){
  const h = new Date().getHours();
  const greet = h < 11 ? 'Selamat pagi!' : h < 15 ? 'Selamat siang!' : h < 18 ? 'Selamat sore!' : 'Selamat malam!';
  document.getElementById('greetingText').textContent = greet;
}

/* =========================================================
   INIT
========================================================= */
setGreeting();
render();
</script>
</body>
