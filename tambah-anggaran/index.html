<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pilih Kategori</title>
<link rel="stylesheet" href="../style.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: 'Poppins', Arial, sans-serif; }
  body { background:#e9edf2; display:flex; justify-content:center; }
  .app { width:100%; max-width:380px; min-height:100vh; background:#fff; }

  /* Top bar */
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:16px; border-bottom:1px solid #eee; }
  .topbar .close { font-size:22px; color:#222; text-decoration:none; font-weight:400; }
  .topbar h2 { font-size:16px; font-weight:700; color:#222; }
  .topbar .atur { font-size:13px; font-weight:600; color:#4a90e2; text-decoration:none; }

  /* Tabs */
  .tabs { display:flex; border-bottom:1px solid #eee; }
  .tabs a { flex:1; text-align:center; padding:12px 0; font-size:13px; color:#999; text-decoration:none; }
  .tabs a.active { color:#222; font-weight:600; border-bottom:2px solid #c026d3; }

  /* Search */
  .search-wrap { padding:16px; }
  .search-box { display:flex; align-items:center; gap:10px; background:#9aa0aa; border:2px solid #1d8fe1; border-radius:10px; padding:10px 14px; }
  .search-box input { border:none; background:transparent; outline:none; font-size:14px; color:#fff; width:100%; }
  .search-box input::placeholder { color:#eee; }
  .search-box .icon { color:#222; font-size:15px; }

  /* Category list */
  .cat-list { padding:0 16px; display:flex; flex-direction:column; gap:14px; }
  .cat-item { border:2px solid #1d8fe1; background:#d9d9d9; border-radius:10px; padding:14px; display:flex; align-items:center; gap:10px; cursor:pointer; text-decoration:none; color:#222; font-size:13px; font-weight:600; transition:background .15s; }
  .cat-item:hover { background:#cfd6dc; }
  .cat-item .icon { font-size:18px; }
</style>
</head>
<body>
<div class="app">

  <!-- Top bar -->
  <div class="topbar">
    <a href="../home/index.html" class="close">&times;</a>
    <h2>Pilih Kategori</h2>
    <a href="../tambah-kategori/index.html" class="atur">Atur Kategori</a>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <a href="#" class="tab-link active" data-tab="pengeluaran" onclick="switchTab(event,'pengeluaran')">Pengeluaran</a>
    <a href="#" class="tab-link" data-tab="pemasukan" onclick="switchTab(event,'pemasukan')">Pemasukan</a>
  </div>

  <!-- Search -->
  <div class="search-wrap">
    <div class="search-box">
      <span class="icon">🔍</span>
      <input type="text" placeholder="Cari">
    </div>
  </div>

  <!-- Category list - Pengeluaran -->
  <div class="cat-list" id="cat-pengeluaran">
    <a href="#" class="cat-item"><span class="icon">👕</span> Belanja</a>
    <a href="#" class="cat-item"><span class="icon">🍔</span> Makan</a>
    <a href="#" class="cat-item"><span class="icon">🎮</span> Main</a>
    <a href="#" class="cat-item"><span class="icon">🚗</span> Transportasi</a>
    <a href="#" class="cat-item"><span class="icon">📄</span> Tagihan</a>
    <a href="#" class="cat-item"><span class="icon">➕</span> Lainnya</a>
  </div>

  <!-- Category list - Pemasukan -->
  <div class="cat-list" id="cat-pemasukan" style="display:none;">
    <a href="#" class="cat-item"><span class="icon">💼</span> Gaji</a>
    <a href="#" class="cat-item"><span class="icon">🎁</span> Bonus</a>
    <a href="#" class="cat-item"><span class="icon">📈</span> Investasi</a>
    <a href="#" class="cat-item"><span class="icon">🏠</span> Sewa</a>
    <a href="#" class="cat-item"><span class="icon">🤝</span> Hadiah</a>
    <a href="#" class="cat-item"><span class="icon">➕</span> Lainnya</a>
  </div>

</div>
<script>
  function switchTab(e, tab) {
    e.preventDefault();
    document.querySelectorAll('.tab-link').forEach(t => t.classList.remove('active'));
    e.target.classList.add('active');
    document.getElementById('cat-pengeluaran').style.display = tab === 'pengeluaran' ? 'flex' : 'none';
    document.getElementById('cat-pemasukan').style.display = tab === 'pemasukan' ? 'flex' : 'none';
  }
</script>
</body>
</html>
