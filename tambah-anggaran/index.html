<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Anggaran Baru - Book Market</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/style.css">
    <style>
        /* Style tambahan khusus tombol hapus kategori kustom */
        .wrapper-kategori-kustom {
            position: relative;
        }
        .btn-hapus-kategori {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 22px;
            height: 22px;
            background-color: #ef4444;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            border: 2px solid #ffffff;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
            transition: transform 0.2s;
        }
        .btn-hapus-kategori:hover {
            transform: scale(1.15);
            background-color: #dc2626;
        }
    </style>
</head>
<body>

    <div class="main-app-container px-4 pt-5">
        <form id="formTambahAnggaran">
            <div class="form-container-box">
                
                <div class="mb-4">
                    <label class="form-label-custom">Nama Anggaran</label>
                    <input type="text" id="nama_anggaran" class="form-control input-field-custom" placeholder="Contoh: Belanja Bulanan" required />
                </div>

                <div class="mb-4">
                    <label class="form-label-custom">Nominal Anggaran</label>
                    <div class="position-relative">
                        <input type="number" id="nominal_anggaran" class="form-control input-field-custom fw-bold" style="padding-left: 3.2rem !important;" placeholder="0" required />
                        <span class="position-absolute top-50 translate-middle-y fw-bold" style="left: 1.25rem; color: #1e3a8a; font-size: 1rem;">Rp</span>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label-custom">Kategori</label>
                    <input type="hidden" name="kategori_terpilih" id="kategori_terpilih" value="Makanan">
                    
                    <div class="mb-3">
                        <button type="button" class="category-select-btn py-2 d-flex align-items-center justify-content-center gap-2" id="btn_tanpa_kategori" data-category="Tanpa Kategori">
                            <i class="bi bi-dash-circle m-0 fs-5" style="width:auto; height:auto; background:none;"></i>
                            <span class="m-0">Tanpa Kategori</span>
                        </button>
                    </div>

                    <div class="row g-3 mb-3" id="gridKategoriUtama">
                        <div class="col-6">
                            <div class="category-select-btn item-kategori selected-active" data-category="Makanan" data-icon="bi-egg-fried" data-color="food">
                                <i class="bi bi-egg-fried bg-icon-food"></i>
                                <span>Makanan</span>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="category-select-btn item-kategori" data-category="Transportasi" data-icon="bi-car-front-fill" data-color="transport">
                                <i class="bi bi-car-front-fill bg-icon-transport"></i>
                                <span>Transportasi</span>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="category-select-btn item-kategori" data-category="Hiburan" data-icon="bi-film" data-color="entertainment">
                                <i class="bi bi-film bg-icon-entertainment"></i>
                                <span>Hiburan</span>
                            </div>
                        </div>
                        <div class="col-6">
                            <div class="category-select-btn item-kategori" data-category="Belanja" data-icon="bi-bag-fill" data-color="shopping">
                                <i class="bi bi-bag-fill bg-icon-shopping"></i>
                                <span>Belanja</span>
                            </div>
                        </div>
                    </div>

                    <a href="/tambah-kategori/index.html" class="btn btn-dash-outline d-flex align-items-center justify-content-center gap-2 text-decoration-none" id="btn_tambah_kategori">
                        <i class="bi bi-plus-circle-fill"></i> Tambah Kategori Baru
                    </a>
                </div>

                <div class="row g-3 pt-3">
                    <div class="col-6">
                        <a href="/anggaran/index.html" class="btn btn-action-cancel text-center text-white text-decoration-none d-block">Batal</a>
                    </div>
                    <div class="col-6">
                        <button type="button" id="btnSimpanAnggaran" class="btn btn-action-save text-white">Simpan</button>
                    </div>
                </div>

            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const gridKategoriUtama = document.getElementById('gridKategoriUtama');
            const btnTanpaKategori = document.getElementById('btn_tanpa_kategori');
            const btnTambahKategori = document.getElementById('btn_tambah_kategori');
            const inputHiddenKategori = document.getElementById('kategori_terpilih');
            
            let itemKategoriGrid = document.querySelectorAll('.item-kategori');
            let kategoriSebelumnya = "Makanan"; 

            // Penampung metadata ikon dan warna dari kategori aktif untuk disimpan ke transaksi anggaran
            let ikonTerpilih = "bi-egg-fried";
            let warnaTerpilih = "food";

            // ================= RENDER KATEGORI KUSTOM DARI LOCALSTORAGE =================
            function renderKategoriKustom() {
                const elemenKustomLama = gridKategoriUtama.querySelectorAll('.wrapper-kategori-kustom');
                elemenKustomLama.forEach(el => el.remove());

                const listKategoriKustom = JSON.parse(localStorage.getItem('kategori_kustom')) || [];
                
                listKategoriKustom.forEach((kat, index) => {
                    const col = document.createElement('div');
                    col.className = 'col-6 wrapper-kategori-kustom';
                    const customColorName = kat.warnaClass.replace('clr-', '');
                    col.innerHTML = `
                        <div class="btn-hapus-kategori" data-index="${index}"><i class="bi bi-x-lg"></i></div>
                        <div class="category-select-btn item-kategori" data-category="${kat.nama}" data-icon="${kat.ikon}" data-color="${customColorName}">
                            <i class="bi ${kat.ikon} bg-icon-${customColorName}"></i>
                            <span>${kat.nama}</span>
                        </div>
                    `;
                    gridKategoriUtama.appendChild(col);
                });

                daftarkanEventKlikKategori();
                daftarkanEventHapusKategori();
            }

            function daftarkanEventHapusKategori() {
                const tombolHapus = document.querySelectorAll('.btn-hapus-kategori');
                tombolHapus.forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        if (confirm("Apakah Anda yakin ingin menghapus kategori kustom ini?")) {
                            const indexHapus = parseInt(this.getAttribute('data-index'));
                            let listKategoriKustom = JSON.parse(localStorage.getItem('kategori_kustom')) || [];
                            
                            if (inputHiddenKategori.value === listKategoriKustom[indexHapus].nama) {
                                inputHiddenKategori.value = "Makanan";
                                kategoriSebelumnya = "Makanan";
                                ikonTerpilih = "bi-egg-fried";
                                warnaTerpilih = "food";
                                const makananBtn = document.querySelector('.item-kategori[data-category="Makanan"]');
                                if (makananBtn) makananBtn.classList.add('selected-active');
                            }

                            listKategoriKustom.splice(indexHapus, 1);
                            localStorage.setItem('kategori_kustom', JSON.stringify(listKategoriKustom));
                            renderKategoriKustom();
                        }
                    });
                });
            }

            function daftarkanEventKlikKategori() {
                itemKategoriGrid = document.querySelectorAll('.item-kategori');
                itemKategoriGrid.forEach(tombol => {
                    const tombolBaru = tombol.cloneNode(true);
                    tombol.parentNode.replaceChild(tombolBaru, tombol);
                });

                itemKategoriGrid = document.querySelectorAll('.item-kategori');
                itemKategoriGrid.forEach(tombol => {
                    tombol.addEventListener('click', function() {
                        if (!this.classList.contains('category-disabled')) {
                            itemKategoriGrid.forEach(btn => btn.classList.remove('selected-active'));
                            btnTanpaKategori.classList.remove('selected-active');
                            
                            this.classList.add('selected-active');
                            kategoriSebelumnya = this.getAttribute('data-category');
                            inputHiddenKategori.value = kategoriSebelumnya;

                            // Tangkap metadata ikon dan warna
                            ikonTerpilih = this.getAttribute('data-icon');
                            warnaTerpilih = this.getAttribute('data-color');
                        }
                    });
                });
            }

            // EVENT LOGIC TOMBOL "TANPA KATEGORI"
            btnTanpaKategori.addEventListener('click', function() {
                const isAktif = this.classList.toggle('selected-active');

                if (isAktif) {
                    inputHiddenKategori.value = "Tanpa Kategori";
                    ikonTerpilih = "bi-dash-circle";
                    warnaTerpilih = "secondary";
                    itemKategoriGrid.forEach(btn => {
                        btn.classList.add('category-disabled');
                        btn.classList.remove('selected-active'); 
                    });
                    btnTambahKategori.classList.add('category-disabled');
                } else {
                    inputHiddenKategori.value = kategoriSebelumnya;
                    
                    // Kembalikan metadata ikon terpilih sebelumnya
                    const lastActiveBtn = document.querySelector(`.item-kategori[data-category="${kategoriSebelumnya}"]`);
                    if (lastActiveBtn) {
                        ikonTerpilih = lastActiveBtn.getAttribute('data-icon');
                        warnaTerpilih = lastActiveBtn.getAttribute('data-color');
                    }

                    itemKategoriGrid.forEach(btn => {
                        btn.classList.remove('category-disabled');
                        if (btn.getAttribute('data-category') === kategoriSebelumnya) {
                            btn.classList.add('selected-active');
                        }
                    });
                    btnTambahKategori.classList.remove('category-disabled');
                }
            });

            // ================= LOGIKA BARU: PROSES SIMPAN TRANSAKSI ANGGARAN =================
            document.getElementById('btnSimpanAnggaran').addEventListener('click', function() {
                const namaAnggaran = document.getElementById('nama_anggaran').value.trim();
                const nominalAnggaran = document.getElementById('nominal_anggaran').value.trim();

                if (namaAnggaran === "" || nominalAnggaran === "" || parseInt(nominalAnggaran) <= 0) {
                    alert("Silakan isi nama anggaran dan nominal target dana dengan benar!");
                    return;
                }

                // Ambil daftar data transaksi anggaran kustom lama atau buat array baru
                let listAnggaranKustom = JSON.parse(localStorage.getItem('anggaran_kustom')) || [];

                // Susun payload objek anggaran baru
                const anggaranBaru = {
                    nama: namaAnggaran,
                    target: parseInt(nominalAnggaran),
                    kategori: inputHiddenKategori.value,
                    ikonClass: ikonTerpilih,
                    warnaClass: warnaTerpilih
                };

                listAnggaranKustom.push(anggaranBaru);
                localStorage.setItem('anggaran_kustom', JSON.stringify(listAnggaranKustom));

                // Arahkan kembali ke halaman manajemen utama anggaran
                window.location.href = "/anggaran/index.html";
            });

            renderKategoriKustom();
        });
    </script>
</body>
</html>
